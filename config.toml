[[watcher]]
source = "file"
path = "/sys/class/backlight/intel_backlight/brightness"
max = 19393
tag = "brightness"

[[watcher]]
source = "pipe"
command = '''
    stdbuf -oL pactl subscribe | grep --line-buffered "change" | while read -r line; do
        SINK_IDX=$(echo "$line" | grep -oP 'sink #\K\d+')
        SINK_INFO=$(pactl list sinks | grep -A 20 "Sink #$SINK_IDX" | awk '/Volume:/ {print $5; exit}')
        echo "$SINK_INFO" | tr -d '%'
    done
'''
tag = "volume"

[[watcher]]
source = "pipe"
command = '''
dbus-monitor "sender='org.mpris.MediaPlayer2.spotify'" \
    | stdbuf -oL grep 'string "Volume"' -A1 \
    | stdbuf -oL awk '/double/ { print $3 }'
'''
tag = "volume:spotify"
debug = true
min = 0
max = 1
